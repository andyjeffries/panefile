name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Arch is the primary target: the newest Qt, every optional dependency
  # present, and the only job that enforces the §11 startup budget — that
  # budget is a Linux acceptance criterion, not a portable one.
  #
  # Note what is deliberately absent: qt6-pdf. On Arch the Qt6Pdf module ships
  # inside qt6-webengine, so depending on it would drag Chromium into a file
  # manager's dependency tree to preview a PDF. §7.6 names poppler-qt6 as the
  # fallback backend, and at ~20 MB against ~500 MB it is the right default
  # here. The PDF renderer is built against poppler on Linux for that reason.
  arch:
    name: Arch (GCC, Release)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja clang \
            qt6-base qt6-multimedia \
            libarchive syntax-highlighting ffmpegthumbnailer poppler-qt6 \
            shared-mime-info hicolor-icon-theme desktop-file-utils \
            hyperfine python

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset release -DPF_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: Check dynamic dependencies
        run: scripts/check-dependencies.sh build/release/bin/pf docs/dependencies-linux.txt

      # Under the offscreen platform plugin: a container has no display server,
      # and the alternative — a software X server under xvfb — would put its own
      # variance into every measurement. Offscreen still performs a real
      # paintEvent, so the phases this is watching for regressions are all
      # exercised; what it omits is the compositor round trip, which is not
      # ours to regress. The authoritative figure comes from real hardware.
      - name: Startup budget
        env:
          QT_QPA_PLATFORM: offscreen
        run: scripts/check-startup-budget.sh build/release/bin/pf docs/startup-baseline-linux.txt

  # Compiler coverage (§15). Ubuntu 24.04 packages Qt 6.4.2 but §2 requires
  # 6.7+, so Qt comes from the official installer rather than from apt. Mixing
  # an aqt-installed Qt with apt's KDE packages would be an ABI mismatch, so the
  # optional features are off here; Arch above covers the full-featured build.
  # What this job is actually for is GCC 14 and Clang 18, which Arch does not
  # have and which users on stable distributions will be compiling with.
  ubuntu:
    name: Ubuntu 24.04 (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ${{ matrix.compiler }} \
            libarchive-dev shared-mime-info desktop-file-utils \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev libx11-xcb-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake --preset dev \
            -DPF_ENABLE_SYNTAX=OFF \
            -DPF_ENABLE_PDF=OFF \
            -DPF_ENABLE_VIDEO_THUMBS=OFF

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev

  # macOS is a supported target, not a development convenience, so it runs the
  # same suite. It is also the only job exercising the FSEvents and
  # DiskArbitration halves of the platform seam.
  macos:
    name: macOS (AppleClang)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install qt ninja libarchive ffmpegthumbnailer poppler-qt6 hyperfine

      - name: Configure
        run: cmake --preset dev -DPF_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev

      - name: Check dynamic dependencies
        run: |
          cmake --preset release
          cmake --build --preset release
          scripts/check-dependencies.sh \
            build/release/bin/pf.app/Contents/MacOS/pf docs/dependencies-darwin.txt

  # §14: run under ASan and UBSan, and treat any leak in a job or the scanner as
  # a bug. Runs on Arch rather than Ubuntu purely because it needs a Qt new
  # enough to build against.
  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja clang qt6-base qt6-multimedia libarchive \
            shared-mime-info

      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset asan

  lint:
    name: clang-format + clang-tidy
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja clang qt6-base qt6-multimedia libarchive \
            shared-mime-info

      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          find src tests \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Configure for compile_commands.json
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset dev

      # moc output and the generated Version.h must exist before clang-tidy can
      # parse a translation unit that includes them.
      - name: Build generated sources
        run: cmake --build --preset dev

      - name: clang-tidy
        run: |
          find src -name '*.cpp' -print0 \
            | xargs -0 clang-tidy -p build/dev --warnings-as-errors='*'
