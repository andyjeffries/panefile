<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Panefile</title>

  <!-- Full-bleed, deliberately.
       The artwork used to be a 112x88 window floating in a transparent 128x128
       canvas. macOS 26 puts every application icon inside its own rounded
       container, so a transparent margin is not empty space — it is filled with
       the system's grey, and Panefile appeared as a small dark rectangle inset
       in a grey squircle while every other application filled its own. The
       background now reaches all four edges and the system's mask does the
       rounding, which is how Figma, Freeform and the rest are drawn. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171820"/>
      <stop offset="1" stop-color="#0d0e12"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="128" height="128" fill="url(#ground)"/>

  <!-- Three panels side by side; the leftmost is focused, which §9 calls the
       single most important visual affordance in the application. It carries
       the accent edge along its top, exactly as a focused panel does. -->
  <rect x="14" y="26" width="30" height="76" rx="6" fill="#31333d"/>
  <rect x="14" y="26" width="30" height="4" rx="2" fill="#4a8cff"/>

  <rect x="50" y="26" width="28" height="76" rx="6" fill="#26272f"/>
  <rect x="84" y="26" width="30" height="76" rx="6" fill="#26272f"/>

  <!-- Rows. The focused panel's cursor row is a filled accent pill, which is
       the other half of the same affordance. -->
  <rect x="18" y="36" width="22" height="8" rx="4" fill="#4a8cff"/>
  <g fill="#7d818f">
    <rect x="18" y="50" width="18" height="5" rx="2.5"/>
    <rect x="18" y="61" width="21" height="5" rx="2.5"/>
    <rect x="18" y="72" width="15" height="5" rx="2.5"/>
    <rect x="18" y="83" width="19" height="5" rx="2.5"/>
  </g>

  <g fill="#4e515c">
    <rect x="54" y="36" width="20" height="5" rx="2.5"/>
    <rect x="54" y="47" width="15" height="5" rx="2.5"/>
    <rect x="54" y="58" width="18" height="5" rx="2.5"/>
    <rect x="54" y="69" width="13" height="5" rx="2.5"/>

    <rect x="88" y="36" width="22" height="5" rx="2.5"/>
    <rect x="88" y="47" width="17" height="5" rx="2.5"/>
    <rect x="88" y="58" width="20" height="5" rx="2.5"/>
    <rect x="88" y="69" width="14" height="5" rx="2.5"/>
  </g>
</svg>
