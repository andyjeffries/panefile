<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Panefile</title>
  <rect x="8" y="20" width="112" height="88" rx="12" fill="#1e1e2e"/>
  <rect x="8" y="20" width="112" height="88" rx="12" fill="none" stroke="#45475a" stroke-width="3"/>

  <!-- Three panels side by side; the leftmost is focused, which is the single
       most important visual affordance in the application (§9). -->
  <rect x="18" y="32" width="30" height="64" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="2.5"/>
  <rect x="54" y="32" width="26" height="64" rx="5" fill="#313244"/>
  <rect x="86" y="32" width="26" height="64" rx="5" fill="#313244"/>

  <g fill="#89b4fa">
    <rect x="23" y="39" width="20" height="4" rx="2"/>
    <rect x="23" y="48" width="16" height="4" rx="2"/>
  </g>
  <g fill="#cdd6f4">
    <rect x="23" y="57" width="18" height="4" rx="2"/>
    <rect x="23" y="66" width="13" height="4" rx="2"/>
  </g>

  <g fill="#6c7086">
    <rect x="59" y="39" width="16" height="4" rx="2"/>
    <rect x="59" y="48" width="11" height="4" rx="2"/>
    <rect x="59" y="57" width="14" height="4" rx="2"/>
    <rect x="91" y="39" width="16" height="4" rx="2"/>
    <rect x="91" y="48" width="12" height="4" rx="2"/>
  </g>
</svg>
