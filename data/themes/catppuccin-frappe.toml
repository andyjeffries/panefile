name = "Catppuccin Frappé"

[colors]
background     = "#303446"
surface        = "#414559"
overlay        = "#737994"
text           = "#c6d0f5"
subtext        = "#a5adce"
accent         = "#8caaee"
selection_bg   = "#51576d"
cursor_bg      = "#626880"
directory      = "#8caaee"
executable     = "#a6d189"
symlink        = "#81c8be"
broken         = "#e78284"
archive        = "#ef9f76"
image          = "#e5c890"
error          = "#e78284"
warning        = "#ef9f76"
success        = "#a6d189"
border         = "#51576d"
border_focused = "#8caaee"

[ui]
# Geometry and type are not part of a theme's identity — a palette is. These
# values are identical in every bundled theme on purpose: switching from Nord to
# Gruvbox should recolour the window, not resize its rows and restyle its text.
#
# They come from the Claude Design polish pass: 13px names, 28px rows, a 6px
# radius for the cursor pill and 10px of panel padding.
font_family       = ""
font_size         = 13
row_height        = 28
border_radius     = 6
panel_padding     = 10
alternating_rows  = true
