name = "Catppuccin Macchiato"

[colors]
background     = "#24273a"
surface        = "#363a4f"
overlay        = "#6e738d"
text           = "#cad3f5"
subtext        = "#a5adcb"
accent         = "#8aadf4"
selection_bg   = "#494d64"
cursor_bg      = "#5b6078"
directory      = "#8aadf4"
executable     = "#a6da95"
symlink        = "#8bd5ca"
broken         = "#ed8796"
archive        = "#f5a97f"
image          = "#eed49f"
error          = "#ed8796"
warning        = "#f5a97f"
success        = "#a6da95"
border         = "#494d64"
border_focused = "#8aadf4"

[ui]
# Geometry and type are not part of a theme's identity — a palette is. These
# values are identical in every bundled theme on purpose: switching from Nord to
# Gruvbox should recolour the window, not resize its rows and restyle its text.
#
# They come from the Claude Design polish pass: 13px names, 28px rows, a 6px
# radius for the cursor pill and 10px of panel padding.
font_family       = ""
font_size         = 13
row_height        = 28
border_radius     = 6
panel_padding     = 10
alternating_rows  = true
