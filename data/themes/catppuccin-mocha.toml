name = "Catppuccin Mocha"

[colors]
background     = "#1e1e2e"
surface        = "#313244"
overlay        = "#6c7086"
text           = "#cdd6f4"
subtext        = "#a6adc8"
accent         = "#89b4fa"
selection_bg   = "#45475a"
cursor_bg      = "#585b70"
directory      = "#89b4fa"
executable     = "#a6e3a1"
symlink        = "#94e2d5"
broken         = "#f38ba8"
archive        = "#fab387"
image          = "#f9e2af"
error          = "#f38ba8"
warning        = "#fab387"
success        = "#a6e3a1"
border         = "#45475a"
border_focused = "#89b4fa"

[ui]
# Geometry and type are not part of a theme's identity — a palette is. These
# values are identical in every bundled theme on purpose: switching from Nord to
# Gruvbox should recolour the window, not resize its rows and restyle its text.
#
# They come from the Claude Design polish pass: 13px names, 28px rows, a 6px
# radius for the cursor pill and 10px of panel padding.
font_family       = ""
font_size         = 13
row_height        = 28
border_radius     = 6
panel_padding     = 10
alternating_rows  = true
