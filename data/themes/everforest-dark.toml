name = "Everforest Dark"

[colors]
background     = "#2d353b"
surface        = "#343f44"
overlay        = "#859289"
text           = "#d3c6aa"
subtext        = "#9da9a0"
accent         = "#7fbbb3"
selection_bg   = "#475258"
cursor_bg      = "#3d484d"
directory      = "#7fbbb3"
executable     = "#a7c080"
symlink        = "#83c092"
broken         = "#e67e80"
archive        = "#e69875"
image          = "#dbbc7f"
error          = "#e67e80"
warning        = "#e69875"
success        = "#a7c080"
border         = "#475258"
border_focused = "#7fbbb3"

[ui]
# Geometry and type are not part of a theme's identity — a palette is. These
# values are identical in every bundled theme on purpose: switching from Nord to
# Gruvbox should recolour the window, not resize its rows and restyle its text.
#
# They come from the Claude Design polish pass: 13px names, 28px rows, a 6px
# radius for the cursor pill and 10px of panel padding.
font_family       = ""
font_size         = 13
row_height        = 28
border_radius     = 6
panel_padding     = 10
alternating_rows  = true
