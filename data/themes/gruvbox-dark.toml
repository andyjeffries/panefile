name = "Gruvbox Dark"

[colors]
background     = "#282828"
surface        = "#3c3836"
overlay        = "#928374"
text           = "#ebdbb2"
subtext        = "#bdae93"
accent         = "#83a598"
selection_bg   = "#504945"
cursor_bg      = "#665c54"
directory      = "#83a598"
executable     = "#b8bb26"
symlink        = "#8ec07c"
broken         = "#fb4934"
archive        = "#fe8019"
image          = "#fabd2f"
error          = "#fb4934"
warning        = "#fe8019"
success        = "#b8bb26"
border         = "#504945"
border_focused = "#83a598"

[ui]
# Geometry and type are not part of a theme's identity — a palette is. These
# values are identical in every bundled theme on purpose: switching from Nord to
# Gruvbox should recolour the window, not resize its rows and restyle its text.
#
# They come from the Claude Design polish pass: 13px names, 28px rows, a 6px
# radius for the cursor pill and 10px of panel padding.
font_family       = ""
font_size         = 13
row_height        = 28
border_radius     = 6
panel_padding     = 10
alternating_rows  = true
