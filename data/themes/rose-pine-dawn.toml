name = "Rosé Pine Dawn"

[colors]
background     = "#faf4ed"
surface        = "#fffaf3"
overlay        = "#9893a5"
text           = "#575279"
subtext        = "#797593"
accent         = "#907aa9"
selection_bg   = "#dfdad9"
cursor_bg      = "#f2e9e1"
directory      = "#56949f"
executable     = "#286983"
symlink        = "#d7827e"
broken         = "#b4637a"
archive        = "#ea9d34"
image          = "#ea9d34"
error          = "#b4637a"
warning        = "#ea9d34"
success        = "#286983"
border         = "#f2e9e1"
border_focused = "#907aa9"

[ui]
# Geometry and type are not part of a theme's identity — a palette is. These
# values are identical in every bundled theme on purpose: switching from Nord to
# Gruvbox should recolour the window, not resize its rows and restyle its text.
#
# They come from the Claude Design polish pass: 13px names, 28px rows, a 6px
# radius for the cursor pill and 10px of panel padding.
font_family       = ""
font_size         = 13
row_height        = 28
border_radius     = 6
panel_padding     = 10
alternating_rows  = true
