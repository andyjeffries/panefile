name = "Rosé Pine Moon"

[colors]
background     = "#232136"
surface        = "#2a273f"
overlay        = "#6e6a86"
text           = "#e0def4"
subtext        = "#908caa"
accent         = "#c4a7e7"
selection_bg   = "#44415a"
cursor_bg      = "#393552"
directory      = "#9ccfd8"
executable     = "#3e8fb0"
symlink        = "#ea9a97"
broken         = "#eb6f92"
archive        = "#f6c177"
image          = "#f6c177"
error          = "#eb6f92"
warning        = "#f6c177"
success        = "#3e8fb0"
border         = "#393552"
border_focused = "#c4a7e7"

[ui]
# Geometry and type are not part of a theme's identity — a palette is. These
# values are identical in every bundled theme on purpose: switching from Nord to
# Gruvbox should recolour the window, not resize its rows and restyle its text.
#
# They come from the Claude Design polish pass: 13px names, 28px rows, a 6px
# radius for the cursor pill and 10px of panel padding.
font_family       = ""
font_size         = 13
row_height        = 28
border_radius     = 6
panel_padding     = 10
alternating_rows  = true
