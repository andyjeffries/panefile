name = "Tokyo Night Day"

[colors]
background     = "#e1e2e7"
surface        = "#d0d5e3"
overlay        = "#848cb5"
text           = "#3760bf"
subtext        = "#6172b0"
accent         = "#2e7de9"
selection_bg   = "#b7c1e3"
cursor_bg      = "#c4c8da"
directory      = "#2e7de9"
executable     = "#587539"
symlink        = "#007197"
broken         = "#f52a65"
archive        = "#b15c00"
image          = "#8c6c3e"
error          = "#f52a65"
warning        = "#b15c00"
success        = "#587539"
border         = "#b7c1e3"
border_focused = "#2e7de9"

[ui]
# Geometry and type are not part of a theme's identity — a palette is. These
# values are identical in every bundled theme on purpose: switching from Nord to
# Gruvbox should recolour the window, not resize its rows and restyle its text.
#
# They come from the Claude Design polish pass: 13px names, 28px rows, a 6px
# radius for the cursor pill and 10px of panel padding.
font_family       = ""
font_size         = 13
row_height        = 28
border_radius     = 6
panel_padding     = 10
alternating_rows  = true
