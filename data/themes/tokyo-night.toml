name = "Tokyo Night"

[colors]
background     = "#1a1b26"
surface        = "#24283b"
overlay        = "#565f89"
text           = "#c0caf5"
subtext        = "#a9b1d6"
accent         = "#7aa2f7"
selection_bg   = "#33467c"
cursor_bg      = "#292e42"
directory      = "#7aa2f7"
executable     = "#9ece6a"
symlink        = "#73daca"
broken         = "#f7768e"
archive        = "#ff9e64"
image          = "#e0af68"
error          = "#f7768e"
warning        = "#ff9e64"
success        = "#9ece6a"
border         = "#292e42"
border_focused = "#7aa2f7"

[ui]
# Geometry and type are not part of a theme's identity — a palette is. These
# values are identical in every bundled theme on purpose: switching from Nord to
# Gruvbox should recolour the window, not resize its rows and restyle its text.
#
# They come from the Claude Design polish pass: 13px names, 28px rows, a 6px
# radius for the cursor pill and 10px of panel padding.
font_family       = ""
font_size         = 13
row_height        = 28
border_radius     = 6
panel_padding     = 10
alternating_rows  = true
