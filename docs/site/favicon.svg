<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Three panels, the middle one focused. Uses the same two neutrals and the
       same accent the application's macOS Light theme does, and swaps them
       under prefers-color-scheme so the icon reads on either background. -->
  <style>
    .frame { fill: #d2d2d7; }
    .pane  { fill: #8e8e93; }
    .focus { fill: #007aff; }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #45475a; }
      .pane  { fill: #6c7086; }
      .focus { fill: #89b4fa; }
    }
  </style>
  <rect class="frame" x="1" y="4" width="30" height="24" rx="4"/>
  <rect class="pane"  x="4"  y="7" width="6"  height="18" rx="1.5"/>
  <rect class="focus" x="12" y="7" width="8"  height="18" rx="1.5"/>
  <rect class="pane"  x="22" y="7" width="6"  height="18" rx="1.5"/>
</svg>
